<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="AM I COOKED? dial mark">
  <defs>
    <radialGradient id="knob" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#312316"/>
      <stop offset="55%" stop-color="#1c140d"/>
      <stop offset="100%" stop-color="#0f0a06"/>
    </radialGradient>
    <radialGradient id="hub" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffd23f"/>
      <stop offset="45%" stop-color="#ff6a2b"/>
      <stop offset="100%" stop-color="#d6472f"/>
    </radialGradient>
    <linearGradient id="ptr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ff6a2b"/>
    </linearGradient>
  </defs>
  <!-- doneness settings: rare → charcoal across the top arc -->
  <g>
    <circle cx="10"   cy="50"   r="4.2" fill="#efe3ce"/>
    <circle cx="21.7" cy="21.7" r="4.2" fill="#dfa575"/>
    <circle cx="50"   cy="10"   r="4.2" fill="#a9713c"/>
    <circle cx="78.3" cy="21.7" r="4.6" fill="#ff6a2b"/>
    <circle cx="90"   cy="50"   r="4.2" fill="#3a2a1e"/>
  </g>
  <!-- knob body -->
  <circle cx="50" cy="50" r="31" fill="url(#knob)" stroke="#eae0ce" stroke-width="2.4"/>
  <circle cx="50" cy="50" r="26.5" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1"/>
  <!-- grip notches -->
  <g stroke="#eae0ce" stroke-opacity=".28" stroke-width="1.6" stroke-linecap="round">
    <line x1="50" y1="21.5" x2="50" y2="25.5"/>
    <line x1="78.5" y1="50" x2="74.5" y2="50"/>
    <line x1="50" y1="78.5" x2="50" y2="74.5"/>
    <line x1="21.5" y1="50" x2="25.5" y2="50"/>
  </g>
  <!-- pointer to the "cooked" setting (upper right) -->
  <line x1="50" y1="50" x2="70.5" y2="29.5" stroke="url(#ptr)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="7.5" fill="url(#hub)" stroke="#0f0a06" stroke-width="1.2"/>
</svg>
